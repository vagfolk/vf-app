<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vägfölk 26 – kassafönster</title>
  <style>
    :root { color-scheme:dark; font:18px system-ui,sans-serif; background:#090b10; color:#f3efe6 }
    body { min-height:100vh; margin:0; display:grid; place-items:center }
    main { width:min(90vw,34rem) }
    h1 { color:#d2a637; font-size:1.5rem }
    p { line-height:1.5 }
    button { background:#34280d; color:#fff; border:1px solid #d2a637;
      border-radius:.5rem; padding:.7rem 1rem; font:inherit; cursor:pointer }
    button:hover,button:focus-visible { background:#57421a }
  </style>
</head>
<body>
  <main>
    <h1>Kassafönster</h1>
    <p>Öppna det separata kassafönstret.</p>
    <button id="open-cash" type="button">Öppna kassafönster</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
  (() => {
    'use strict';
    const cashUrl = 'https://vagfolk.github.io/vf-app/public/cash/';
    const cashOrigin = 'https://vagfolk.github.io';
    const status = document.getElementById('status');
    let cashWindow = null;
    let activeNonce = null;
    let checking = false;
    let granted = false;
    const pending = new Set();
    const cashActions = new Set(['cash_list', 'cash_get', 'cash_open',
      'cash_event', 'cash_abort', 'cash_review', 'cash_manual_book',
      'cash_post', 'cash_verify_swish', 'cash_recovery_done',
      'cash_mark_lost', 'cash_qr']);
    document.getElementById('open-cash').addEventListener('click', () => {
      activeNonce = null;
      checking = false;
      granted = false;
      pending.clear();
      cashWindow = window.open(cashUrl, 'vf26-cash-window');
      status.textContent = cashWindow
        ? 'Kassafönstret öppnades. Kontrollerar behörighet…'
        : 'Webbläsaren stoppade kassafönstret. Tillåt popupfönster för appen och försök igen.';
    });
    window.addEventListener('message', event => {
      if (!cashWindow || event.source !== cashWindow ||
          event.origin !== cashOrigin) return;
      if (event.data?.type === 'vf-cash-parent-request') {
        const data = event.data;
        if (!granted || data.nonce !== activeNonce ||
            typeof data.requestId !== 'string' ||
            !/^[a-f0-9-]{36}$/.test(data.requestId) ||
            !cashActions.has(data.action) || pending.size >= 4 ||
            pending.has(data.requestId)) return;
        let inputSize;
        try { inputSize = JSON.stringify(data.input).length; } catch (_) { return; }
        if (inputSize > 25000) return;
        pending.add(data.requestId);
        const source = event.source;
        const nonce = activeNonce;
        const reply = result => {
          pending.delete(data.requestId);
          if (cashWindow !== source || activeNonce !== nonce || !granted) return;
          source.postMessage({ type:'vf-cash-parent-response', nonce,
            requestId:data.requestId, result }, cashOrigin);
        };
        google.script.run.withSuccessHandler(reply).withFailureHandler(() => {
          reply({ allowed:false, reason:'data_unavailable' });
        }).cashRequest(data.action, data.input);
        return;
      }
      if (event.data?.type !== 'vf-cash-parent-ready' ||
          typeof event.data.nonce !== 'string' ||
          !/^[a-f0-9-]{36}$/.test(event.data.nonce) || checking) return;
      activeNonce = event.data.nonce;
      checking = true;
      granted = false;
      const targetWindow = event.source;
      const nonce = activeNonce;
      const reply = allowed => {
        if (cashWindow !== targetWindow || activeNonce !== nonce) return;
        targetWindow.postMessage({ type:'vf-cash-parent-result', nonce,
          allowed }, cashOrigin);
        checking = false;
      };
      google.script.run.withSuccessHandler(result => {
        const allowed = result?.allowed === true &&
          result.data?.permissions?.includes('sales_manage') === true;
        granted = allowed;
        status.textContent = allowed ? 'Kassabehörighet bekräftad.' : 'Ingen åtkomst till kassan.';
        reply(allowed);
      }).withFailureHandler(() => {
        status.textContent = 'Kassabehörigheten kunde inte bekräftas.';
        reply(false);
      }).readDashboardData('profile');
    });
  })();
  </script>
</body>
</html>
