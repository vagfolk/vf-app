</style>
  <script>
/* Vyerna visar bara uppgifter som den skyddade anslutningen tillåter. */
(() => {
  const state = {
    messages: [],
    information: null,
    editingCard: null,
    taskFormOpen: false,
  };
  const targets = new Set();
  let currentView = 'start';

  const element = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const paragraph = (text, className = '') => element('p', className, text);
  const button = (text, action, value, pressed) => {
    const node = element('button', '', text);
    node.type = 'button';
    node.dataset.action = action;
    if (value !== undefined) node.dataset.value = String(value);
    if (pressed !== undefined) node.setAttribute('aria-pressed', String(pressed));
    return node;
  };
  const card = (title, body, className = '') => {
    const node = element('section', `view-card ${className}`.trim());
    node.append(element('h3', '', title), paragraph(body));
    return node;
  };
  const heading = title => element('h2', 'view-screen-reader-only', title);
  const notice = () => document.createDocumentFragment();
  const formatEventDate = event => {
    const date = event.allDay && /^\d{4}-\d{2}-\d{2}$/.test(event.start)
      ? new Date(`${event.start}T12:00:00`) : new Date(event.start);
    return new Intl.DateTimeFormat('sv-SE', {
      weekday:'short',day:'numeric',month:'long',
      ...(event.allDay ? {} : {hour:'2-digit',minute:'2-digit'})
    }).format(date);
  };
  const formatEvent = event => `${formatEventDate(event)} · ${event.title}`;
  const nextMeeting = (events, kind) => events.find(event =>
    event.kind === kind && /möte/i.test(event.title) &&
    new Date(event.start).getTime() >= Date.now());
  const group = (...children) => {
    const node = element('div', 'view-actions');
    node.append(...children);
    return node;
  };
  const renderStart = (root, options) => {
    // Den skyddade appen får inte rita en medlemsvy innan profilen är känd.
    // Annars blinkar medlemskort fram för en styrelseanvändare under laddning.
    if (options.connection && !options.user) return;
    root.append(heading(options.name ? `Hej, ${options.name.split(/\s+/)[0]}` : 'Välkommen', 'Mina sidor'));
    const permissions = new Set(options.user?.permissions || []);
    const isBoard = permissions.has('board_view');
    const events = options.calendar?.events || [];
    if (!isBoard) {
      const grid = element('div', 'view-grid');
      const memberMeeting = nextMeeting(events, 'member');
      const meeting = card('Nästa medlemsmöte', memberMeeting
        ? formatEvent(memberMeeting) : options.calendar?.error
          ? 'Kalendern kunde inte hämtas.' : 'Inget kommande medlemsmöte hittades.');
      meeting.append(button('Öppna kalender', 'navigate', 'kalender'));
      const info = options.information?.message;
      const board = card('Information', info?.text || 'Inget viktigt meddelande publicerat.');
      board.append(button('Öppna information', 'navigate', 'information'));
      grid.append(meeting, board);
      root.append(grid);
    }
    const actions = element('div','view-actions');
    if (isBoard) {
      actions.append(button('Ekonomi','navigate','board'), button('Medlemmar','navigate','medlemmar'),
        button('Viktigt meddelande','navigate','information_manage'));
      for (const [kind, title] of [['member', 'Ändra medlemskalender'], ['board', 'Ändra styrelsekalender']]) {
        const url = options.calendar?.links?.[kind];
        if (typeof url !== 'string' || !/^https:\/\/calendar\.google\.com\/calendar\//.test(url)) continue;
        const link = element('a', 'view-calendar-link', title);
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        actions.append(link);
      }
    }
    actions.append(isBoard
      ? button('Att göra', 'open-task-form')
      : button('Att göra', 'navigate', 'medlemsarbete'));
    if (permissions.has('recovery_manage')) actions.append(button('Administration','navigate','admin'));
    if (options.user && options.connection !== 'google_test') actions.append(button('Logga ut','signout'));
    root.append(actions, notice());
    if (isBoard && options.connection === 'google_test' && state.taskFormOpen) {
      const form = element('form', 'view-task-form');
      form.dataset.form = 'task';
      const label = element('label', 'view-screen-reader-only', 'Lägg till uppgift');
      label.htmlFor = 'task-entry-' + root.id;
      const input = element('textarea');
      input.id = label.htmlFor;
      input.name = 'task';
      input.rows = 1;
      input.maxLength = 100;
      input.required = true;
      input.placeholder = 'Skriv en kort uppgift';
      const kindLabel = element('label', 'view-screen-reader-only', 'Lista');
      kindLabel.htmlFor = 'task-kind-' + root.id;
      const kind = element('select');
      kind.id = kindLabel.htmlFor;
      kind.name = 'kind';
      for (const [value, title] of [
        ['medlem', 'Medlem'], ['styrelse', 'Styrelse'], ['prioriterad', 'Prioriterad']
      ]) {
        const choice = element('option', '', title);
        choice.value = value;
        kind.append(choice);
      }
      form.append(label, input, kindLabel, kind,
        button('Lägg till uppgift', 'submit-task'));
      root.append(form);
      renderTasks(root, options, true);
    }
  };
  const renderCalendar = (root, options) => {
    const now = new Date();
    const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    root.append(heading('Kalender'));
    if (options.calendar?.error) root.append(card('Kalendern kunde inte hämtas', 'Försök igen senare.', 'alert'));
    else if (!options.calendar) root.append(card('Hämtar kalender', 'Vänta ett ögonblick.'));
    else {
      const boardAllowed = options.user?.permissions?.includes('board_view');
      const columns = element('div', 'view-calendar-columns');
      for (const kind of boardAllowed ? ['member', 'board'] : ['member']) {
        const section = element('section', 'view-calendar-section');
        const header = element('div', 'view-calendar-section-header');
        header.append(element('h3', '', kind === 'member' ? 'Medlemskalender' : 'Styrelsekalender'));
        section.append(header);
        const list = element('ul', 'view-calendar-events');
        const events = (options.calendar.events || []).filter(event =>
          event.kind === kind && new Date(event.start) < nextMonth &&
          new Date(event.end) > now);
        if (!events.length) list.append(element('li', 'view-calendar-empty', 'Inga fler händelser denna månad.'));
        for (const event of events) {
          const row = element('li', 'view-calendar-event');
          const date = element('time', '', formatEventDate(event));
          date.dateTime = event.start;
          row.append(date, element('span', '', event.title));
          list.append(row);
        }
        section.append(list);
        columns.append(section);
      }
      root.append(columns);
    }
    root.append(notice());
  };
  const renderTasks = (root, options, management = false) => {
    const boardAllowed = options.user?.permissions?.includes('board_view');
    root.append(heading('Att göra'));
    const tasks = (options.tasks?.tasks || [])
      .filter(task => boardAllowed || task.kind !== 'styrelse');
    const section = (kind, title) => {
      const area = element('section', `view-task-section view-task-${kind}`);
      area.append(element('h3', '', title));
      const list = element('ul', 'view-task-list');
      const matches = tasks.filter(task => task.kind === kind);
      if (!matches.length) list.append(element('li', 'view-task-empty', 'Inga uppgifter.'));
      for (const task of matches) {
        const row = element('li', 'view-task-row');
        const label = element('label', 'view-task-label');
        const checkbox = element('input');
        checkbox.type = 'checkbox';
        checkbox.checked = Boolean(task.done);
        checkbox.disabled = management || options.connection !== 'google_test' ||
          (task.done && !task.canRecall);
        if (!management) {
          checkbox.dataset.action = 'task-toggle';
          checkbox.dataset.value = String(task.id);
        }
        checkbox.setAttribute('aria-label', `${task.done ? 'Återkalla' : 'Markera klar'}: ${task.text}`);
        label.append(checkbox, element('span', '', task.text));
        row.append(label);
        if (management && boardAllowed && task.done && options.connection === 'google_test') {
          const review = element('div', 'view-task-review');
          if (task.completedBy) {
            review.append(element('span', 'view-task-completer',
              `Utförd av ${task.completedBy}${task.completedAt ? ` · ${new Date(task.completedAt).toLocaleString('sv-SE')}` : ''}`));
          }
          const archive = element('button', 'view-task-archive', 'Godkänn och arkivera');
          archive.type = 'button';
          archive.dataset.action = 'task-archive';
          archive.dataset.value = String(task.id);
          review.append(archive);
          row.append(review);
        }
        list.append(row);
      }
      area.append(list);
      return area;
    };
    const layout = element('div', 'view-task-layout');
    layout.append(section('prioriterad', 'Prioriterade'));
    const lower = element('div', `view-task-lower${boardAllowed ? ' view-task-lower-board' : ''}`);
    lower.append(section('medlem', 'Medlemmar'));
    if (boardAllowed) lower.append(section('styrelse', 'Styrelsen'));
    layout.append(lower);
    root.append(layout);
  };
  const renderInformation = (root, options, management = false) => {
    root.append(heading('Information', 'Viktigt meddelande från styrelsen'));
    const boardAllowed = options.user?.permissions?.includes('board_view');
    const message = options.information?.message || state.information;
    if (options.information?.error) {
      root.append(card('Kunde inte läsa information', 'Försök igen senare.', 'alert'));
      return;
    }
    if (!options.information && options.connection === 'google_test') {
      root.append(card('Hämtar information', 'Vänta ett ögonblick.'));
      return;
    }
    if (management && boardAllowed) {
      const form = element('form');
      form.dataset.form = 'information';
      const input = element('textarea');
      input.id = 'information-entry-' + root.id;
      input.setAttribute('aria-label', 'Viktigt meddelande');
      input.name = 'information';
      input.maxLength = 600;
      input.required = true;
      input.rows = 4;
      form.append(input,group(button('Skicka viktigt meddelande','submit-information')));
      root.append(form);
      const history = element('section', 'view-information-history');
      history.append(element('h3', '', 'Publicerade meddelanden'));
      const list = element('ul', 'view-information-list');
      const messages = options.information?.messages || (message ? [message] : []);
      if (!messages.length) list.append(element('li', 'view-information-empty', 'Inga meddelanden publicerade.'));
      for (const item of messages) {
        const row = element('li', 'view-information-item');
        row.append(paragraph(item.text));
        if (item.createdAt) row.append(paragraph(`${item.name || 'Styrelsen'} · ${new Intl.DateTimeFormat('sv-SE',{dateStyle:'medium',timeStyle:'short'}).format(new Date(item.createdAt))}`, 'view-muted'));
        if (options.connection === 'google_test') row.append(button('Ta bort', 'delete-information', item.id));
        list.append(row);
      }
      history.append(list);
      root.append(history);
    } else {
      root.append(card(message ? 'Från styrelsen' : 'Ingen information publicerad',
        message?.text || 'Här visas viktiga meddelanden från styrelsen.'));
      if (message?.createdAt) root.append(paragraph(`${message.name || 'Styrelsen'} · ${new Intl.DateTimeFormat('sv-SE',{dateStyle:'medium',timeStyle:'short'}).format(new Date(message.createdAt))}`, 'view-muted'));
    }
  };
  const renderChat = (root, options) => {
    root.append(heading('Chat', 'Korta meddelanden'));
    if (options.chat?.error) root.append(card('Kunde inte läsa Chat', 'Försök igen senare.', 'alert'));
    else if (!options.chat && options.connection === 'google_test') root.append(card('Hämtar Chat', 'Vänta ett ögonblick.'));
    const list = element('ul','view-list');
    const messages = options.chat?.messages || state.messages;
    if (!messages.length) list.append(element('li','','Inga meddelanden ännu.'));
    messages.forEach(item => {
      const row = element('li','view-row view-chat-row');
      row.append(element('strong','',item.name || 'Medlem'),paragraph(item.text || ''));
      if (item.createdAt) row.append(element('time','',new Intl.DateTimeFormat('sv-SE',{dateStyle:'short',timeStyle:'short'}).format(new Date(item.createdAt))));
      list.append(row);
    });
    root.append(list);
    const form = element('form');
    form.dataset.form = 'message';
    const label = element('label','','Nytt kort meddelande');
    label.htmlFor = 'message-entry-' + root.id;
    const input = element('input');
    input.id = label.htmlFor;
    input.name = 'message';
    input.maxLength = 120;
    input.required = true;
    input.placeholder = 'Skriv högst 120 tecken';
    const compose = element('div', 'view-chat-compose');
    compose.append(input, button('Skicka', 'submit-message'));
    const shortcuts = group(button('Blir sen','quick-message','Blir sen'),
      button('Hittar inte dit','quick-message','Hittar inte dit'),
      button('Behöver hjälp','quick-message','Behöver hjälp'));
    shortcuts.className += ' view-chat-shortcuts';
    form.append(label, compose, shortcuts);
    root.append(form);
  };
  const renderDocuments = (root, options) => {
    const boardAllowed = options.user?.permissions?.includes('board_view');
    const folders = options.user?.documentFolders || {};
    const columns = element('div', `view-document-columns${boardAllowed ? ' view-document-columns-board' : ''}`);
    const section = (kind, title) => {
      const area = element('section', `view-document-section view-document-${kind}`);
      area.append(element('h3', '', title));
      const url = folders[kind];
      if (typeof url === 'string' &&
          /^https:\/\/drive\.google\.com\/drive\/folders\/[A-Za-z0-9_-]{20,128}$/.test(url)) {
        const link = element('a', 'view-document-link', 'Öppna dokument');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', `Öppna ${title.toLowerCase()} i Google Drive`);
        area.append(link);
      } else area.append(paragraph('Dokumenten är inte tillgängliga.', 'view-document-empty'));
      return area;
    };
    columns.append(section('member', 'Medlemsdokument'));
    if (boardAllowed) columns.append(section('board', 'Styrelsedokument'));
    root.append(columns);
    root.append(notice());
  };
  const renderFee = root => {
    root.append(heading('Min avgift','Medlemsstatus'));
    const fee = window.VFPreviewViews.options.fee;
    if (!fee) {
      root.append(card('Status saknas', 'Din avgift kunde inte hämtas. Ladda om sidan eller försök senare.', 'alert'));
      return;
    }
    const info = element('div','view-card notice');
    info.append(element('div','view-status-line'));
    info.firstChild.append(element('span','view-status-dot'),element('strong','',fee.status === 'paid' ? 'Medlemsavgift betald' : fee.status === 'unpaid' ? 'Medlemsavgift inte betald' : 'Status okänd'));
    info.dataset.status = fee.status;
    if (fee.remaining > 0) info.append(paragraph(`Återstår: ${new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK',maximumFractionDigits:0}).format(fee.remaining)}`));
    if (fee.dueDate) info.append(paragraph(`Förfallodatum: ${new Intl.DateTimeFormat('sv-SE',{year:'numeric',month:'long',day:'numeric'}).format(new Date(`${fee.dueDate}T00:00:00`))}`));
    if (fee.paymentNotice === 'due_soon') info.append(paragraph('Medlemsavgiften behöver snart betalas.'));
    if (fee.paymentNotice === 'overdue') info.append(paragraph('Medlemsavgiften har passerat förfallodatum.'));
    root.append(info,notice());
  };
  const renderBoardSummary = (root, options) => {
    if (!options.user?.permissions?.includes('board_view')) return root.append(heading('Ingen åtkomst','Styrelseöversikt'));
    root.append(heading('Styrelseöversikt','Ekonomi i korthet'));
    if (!options.boardSummary) return root.append(card('Läser uppgifter', 'Vänta ett ögonblick.'));
    if (options.boardSummary.error) return root.append(card('Kunde inte läsa', 'Försök igen senare.', 'alert'));
    const summary = options.boardSummary;
    root.append(card('Period',summary.period));
    const grid = element('div','view-grid');
    const format = value => new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK'}).format(value);
    grid.append(card('Bank',format(summary.bank)),card('Kontanter',format(summary.cash)),card('Resultat',format(summary.result)));
    root.append(grid);
  };
  const renderPlanned = (root,title,description) => root.append(heading(title),card(title,description));
  const renderRestricted = (root,options,permission,title,description) => {
    if (!options.user?.permissions?.includes(permission)) return root.append(heading('Ingen åtkomst',title));
    return renderPlanned(root,title,description);
  };
  const contactForm = (contact = null) => {
    const form = element('form', 'view-contact-form');
    form.dataset.form = 'contact';
    form.dataset.cardId = contact?.cardId || '';
    form.dataset.memberId = contact?.memberId || '';
    form.dataset.updateEko = String(Boolean(contact?.memberId));
    const fields = [
      ['name', 'Namn', 80, contact?.name || ''],
      ['memberId', 'Medlems-ID i EKO', 80, contact?.memberId || ''],
      ['phone', 'Telefon', 40, contact?.phone || ''],
      ['email', 'E-post', 120, contact?.email || '']
    ];
    for (const [key, title, max, value] of fields) {
      const label = element('label', '', title);
      const input = element('input');
      input.name = key;
      input.maxLength = max;
      input.value = value;
      input.id = `contact-${key}-${contact?.cardId || contact?.memberId || 'new'}`;
      label.htmlFor = input.id;
      if (key === 'name') input.required = true;
      if (key === 'memberId' && contact?.memberId) input.readOnly = true;
      if (key === 'name' && contact?.memberId) input.readOnly = true;
      if (key === 'email') input.type = 'email';
      if (key === 'phone') input.type = 'tel';
      form.append(label, input);
    }
    const descriptionLabel = element('label', '', 'Kort beskrivning');
    const description = element('textarea');
    description.name = 'description';
    description.maxLength = 400;
    description.rows = 3;
    description.value = contact?.description || '';
    description.id = `contact-description-${contact?.cardId || contact?.memberId || 'new'}`;
    descriptionLabel.htmlFor = description.id;
    form.append(descriptionLabel, description);
    const photoLabel = element('label', '', 'Välj foto från galleri');
    const photo = element('input');
    photo.type = 'file';
    photo.name = 'gallery';
    photo.accept = 'image/*';
    photoLabel.append(photo);
    const cameraLabel = element('label', '', 'Ta nytt foto');
    const camera = element('input');
    camera.type = 'file';
    camera.name = 'camera';
    camera.accept = 'image/*';
    camera.setAttribute('capture', 'environment');
    cameraLabel.append(camera);
    form.append(photoLabel, cameraLabel);

    window.VFDashboard.startStartup?.();

      const result = await call('authorizeDashboardView', view);

    async function loadLocalForecast() {
      const feedback = document.querySelector('#forecast-feedback');
      forecastTemperature = null;
      showDashboardDetails();
      feedback.textContent = 'Hämtar plats och prognos…';
      if (!navigator.geolocation) { feedback.textContent = 'Platsåtkomst stöds inte här.'; return; }
      try {
        const position = await new Promise((resolve,reject) => navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:10000,maximumAge:600000}));
        const lon = position.coords.longitude.toFixed(2);
        const lat = position.coords.latitude.toFixed(2);
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        let response;
        try { response = await fetch('https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/' + lon + '/lat/' + lat + '/data.json?timeseries=4&parameters=air_temperature',{signal:controller.signal}); }
        finally { clearTimeout(timer); }
        if (!response.ok) throw new Error('SMHI kunde inte lämna en prognos');
        const data = await response.json();
        const now = Date.now();
        const forecast = data.timeSeries?.find(item => Date.parse(item.time) >= now - 3600000 && Number.isFinite(item.data?.air_temperature) && item.data.air_temperature > -100 && item.data.air_temperature < 100);
        if (!forecast) throw new Error('Ingen aktuell prognostemperatur finns');
        forecastTemperature = forecast.data.air_temperature;
        forecastPermissionDenied = false;
        showDashboardDetails();
        feedback.textContent = `SMHI:s prognos för din ungefärliga plats, giltig ${new Intl.DateTimeFormat('sv-SE',{hour:'2-digit',minute:'2-digit'}).format(new Date(forecast.time))}.`;
      } catch(error) {
        forecastPermissionDenied = error.code === 1;
        feedback.textContent = forecastPermissionDenied ? 'Platsåtkomst nekades. Ingen temperatur visas.' : 'Temperatur kunde inte hämtas. Kontrollera anslutningen och prova igen.';
      }
    }

      window.VFPreviewViews.show(selectedMenu,{name:previewName, ...window.VFAppData});

    function updateScreenContentVisibility() {
      const active = activeLayoutView === 'interactive' || activeLayoutView === 'all';
      const hasProfile = Boolean(window.VFAppData?.user);
      const canShow = !document.body.classList.contains('app-mode') || hasProfile;
      const boardStart = selectedMenu === 'start' &&
        window.VFAppData?.user?.permissions?.includes('board_view');
      screenContent.hidden = !((active && canShow && (selectedMenu !== 'start' || boardStart)) ||
        (activeLayoutView === 'cards' && selectedCard));

    function finishStartupVideo() {
      if (!startupActive || startupFinished) return;
      startupFinished = true;
      if (startupPendingData) {
        const data = startupPendingData;
        startupPendingData = null;
        window.VFDashboard.setData(data);
      }
    }

    function positionStartup() {
      if (!startupActive) return;
      const compact = matchMedia('(max-width:1199px)').matches;
      const host = compact ? compactStartupHost : screenViewport;
      if (startupLayer.parentElement !== host) host.append(startupLayer);
      compactStartupHost.hidden = !compact;
      if (!startupFinished && (compact || stage.dataset.ready === 'true')) {
        startupVideo.play().catch(finishStartupVideo);
      }
    }

    function startStartup() {
      // En ny fullständig inloggning får en animation; ändringskontrollerna anropar aldrig detta.
      if (startupStarted || !document.body.classList.contains('app-mode')) return;
      startupStarted = true;
      startupActive = true;
      startupFinished = false;
      if (!startupSourcesReady) {
        for (const [file, type] of [
          ['Vagfolk26_Startsekvens_12s_v4.webm', 'video/webm'],
          ['Vagfolk26_Startsekvens_12s_v4.mp4', 'video/mp4'],
        ]) {
          const mediaSource = document.createElement('source');
          mediaSource.src = new URL('loading/' + file, source).href;
          mediaSource.type = type;
          startupVideo.append(mediaSource);
        }
        startupSourcesReady = true;
        startupVideo.load();
      }
      startupLayer.hidden = false;
      startupVideo.currentTime = 0;
      positionStartup();
    }

    function endStartup() {
      if (!startupActive) return;
      startupActive = false;
      startupPendingData = null;
      startupLayer.hidden = true;
      compactStartupHost.hidden = true;
      startupVideo.pause();
    }

    async function selectMenu(id) {
      if (!menu.some(entry => entry.id === id) &&
          !['information', 'information_manage', 'medlemmar'].includes(id) && !Object.hasOwn(restrictedViews,id)) return;
      if (['information_manage', 'medlemmar'].includes(id) &&
          !window.VFAppData?.user?.permissions?.includes('board_view')) return;
      const request = ++navigationRequest;
      const required = restrictedViews[id];
      if (required && !window.VFAppData?.user?.permissions?.includes(required)) {
        status.textContent = 'Du har inte åtkomst till den delen.';
        return;
      }
      if (required) {
        status.textContent = 'Kontrollerar behörighet…';
        try {
          if (!await window.VFDashboard?.authorizeView?.(id)) {
            if (request === navigationRequest) status.textContent = 'Du har inte åtkomst till den delen.';
            return;
          }
        } catch {
          if (request === navigationRequest) status.textContent = 'Behörigheten kunde inte kontrolleras.';
          return;
        }
        if (request !== navigationRequest) return;
      }
      selectedMenu = id;
      const item = menu.find(entry => entry.id === id);
      screenContent.hidden = true;
      renderMenuContent();
      updateScreenContentVisibility();
      showMenuSelection();
      for (const button of compactNav.querySelectorAll('button')) {
        if (button.dataset.menu === id) button.setAttribute('aria-current','page');
        else button.removeAttribute('aria-current');
      }
      status.textContent = `${item?.label || 'Översikt'} öppnad i mittdisplayen.`;
      document.dispatchEvent(new CustomEvent('vf:view-selected', {detail:{id}}));
    }

    function buildMenu() {
      for (const item of menu) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.menu = item.id;
        button.setAttribute('aria-label', item.label);
        button.title = item.label;
        button.style.setProperty('--menu-left', `${item.left / 1672 * 100}%`);
        button.style.setProperty('--menu-top', `${item.top / 941 * 100}%`);
        button.style.setProperty('--menu-width', `${item.width / 1672 * 100}%`);
        button.style.setProperty('--menu-height', `${item.height / 941 * 100}%`);
        button.addEventListener('click', () => selectMenu(item.id));
        button.addEventListener('pointerenter', () => { hoveredMenu = item.id; showMenuSelection(); });
        button.addEventListener('pointerleave', () => { hoveredMenu = null; showMenuSelection(); });
        button.addEventListener('focus', () => { hoveredMenu = item.id; showMenuSelection(); });
        button.addEventListener('blur', () => { hoveredMenu = null; showMenuSelection(); });
        menuHits.append(button);
        const compactButton = document.createElement('button');
        compactButton.type = 'button';
        compactButton.dataset.menu = item.id;
        compactButton.textContent = item.label;
        compactButton.addEventListener('click', () => selectMenu(item.id));
        compactNav.append(compactButton);
      }
      showMenuSelection();
      compactNav.querySelector('[data-menu="start"]').setAttribute('aria-current','page');
    }

    function setView(view, onlyId = null) {
      activeLayoutView = view;
      original.hidden = view !== 'original';
      for (const {image, info} of panels) image.hidden = view === 'original' || view === 'frame' || (view === 'single' && info.id !== onlyId);
      for (const {image, panelId} of iconVariants) image.hidden = view === 'original' || view === 'frame' || (view === 'single' && panelId !== onlyId);
      const interactive = view === 'interactive' || view === 'all';
      screenViewport.hidden = !(interactive || view === 'cards');
      menuHits.hidden = !interactive;
      menuLabelArt.hidden = view === 'original' || view === 'frame' || view === 'single' && onlyId !== '04';
      modeHits.hidden = view !== 'mode' && view !== 'interactive';
      cardHits.hidden = view !== 'cards' && view !== 'interactive';
      surfaceHits.hidden = view !== 'surfaces';
      memberArt.toggleAttribute('hidden', view === 'original' || view === 'frame' || view === 'single' && onlyId !== '13');
      dashboardArt.toggleAttribute('hidden', view === 'original' || view === 'frame' || view === 'single');
      document.querySelector('#status-options').dataset.visible = String(view === 'member');
      showMenuSelection();
      showModeSelection();
      if (interactive) renderMenuContent();
      showCardSelection();
      showSurfaceSelection();
      updateScreenContentVisibility();
      for (const button of document.querySelectorAll('[data-view]')) {
        const active = button.dataset.view === view && (view !== 'single' || button.dataset.id === onlyId);
        button.setAttribute('aria-pressed', String(active));
      }
      const label = interactive ? `${menu.find(item => item.id === selectedMenu)?.label || 'Översikt'} vald.` : view === 'mode' ? 'Visningsläge valt.' : view === 'cards' ? 'Informationskort valt.' : view === 'surfaces' ? 'Skärmyta vald.' : view === 'member' ? 'Medlemsstatus visas.' : view === 'original' ? 'Originalbild' : view === 'frame' ? 'Endast ytterram' : view === 'single' ? `Ytterram och panel ${onlyId}` : 'Ytterram och samtliga 14 paneler';
      status.textContent = label;
    }

    async function initialize() {
      try {
        const [response, placementResponse] = await Promise.all([
          fetch(new URL('paneler_layout.json', source)),
          fetch('https://vagfolk.github.io/vf-app/public/placements.json'),
        ]);
        if (!response.ok || !placementResponse.ok) throw new Error('Placeringarna kunde inte läsas');
        const [layout, corrected] = await Promise.all([response.json(), placementResponse.json()]);
        if (layout.width !== 1672 || layout.height !== 941 || layout.panels.length !== 14 || corrected.panels.length !== 14) throw new Error('Bildmått eller antal paneler stämmer inte');
        const positions = new Map(corrected.panels.map(position => [position.id, position]));

        const frame = document.createElement('img');
        frame.className = 'frame';
        frame.alt = '';
        frame.src = new URL(layout.frame.file, source).href;
        stage.prepend(frame);
        original.src = new URL(layout.source_image, source).href;

        panels = layout.panels.map(info => {
          const position = positions.get(info.id);
          if (!position) throw new Error(`Placering saknas för panel ${info.id}`);
          const image = document.createElement('img');
          image.className = 'panel';
          image.classList.add(`panel-${info.id}`);
          image.alt = '';
          image.src = new URL(info.file, source).href;
          image.style.left = `${position.x / layout.width * 100}%`;
          image.style.top = `${position.y / layout.height * 100}%`;
          image.style.width = `${position.width / layout.width * 100}%`;
          image.style.height = `${position.height / layout.height * 100}%`;
          stage.append(image);

          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.view = 'single';
          button.dataset.id = info.id;
          button.textContent = `${info.id}. ${info.name}`;
          button.addEventListener('click', () => setView('single', info.id));
          list.append(button);
          return {image, info, position};
        });

        iconVariants = iconCrops.map(crop => {
          const panel = panels.find(entry => entry.info.id === crop.panelId);
          if (!panel) throw new Error(`Ikonens panel ${crop.panelId} saknas`);
          const image = document.createElement('img');
          image.className = 'icon-variant';
          image.alt = '';
          image.src = panel.image.src;
          image.style.left = panel.image.style.left;
          image.style.top = panel.image.style.top;
          image.style.width = panel.image.style.width;
          image.style.height = panel.image.style.height;
          image.style.clipPath = `inset(${crop.y / panel.position.height * 100}% ${(panel.position.width - crop.x - crop.width) / panel.position.width * 100}% ${(panel.position.height - crop.y - crop.height) / panel.position.height * 100}% ${crop.x / panel.position.width * 100}%)`;
          image.style.filter = `url(#icon-${crop.filter})`;
          stage.append(image);
          return {image, panelId:crop.panelId};
        });

        const menuImages = [menuStartNeutral.querySelector('img')];
        await Promise.all([frame, original, ...panels.map(panel => panel.image), ...iconVariants.map(variant => variant.image), ...menuImages].map(image => new Promise((resolve,reject) => {
          if (image.complete) return image.naturalWidth ? resolve() : reject(new Error(`Bilden saknas: ${image.src}`));
          image.addEventListener('load', resolve, {once:true});
          image.addEventListener('error', () => reject(new Error(`Bilden saknas: ${image.src}`)), {once:true});
        })));
        const mismatch = panels.find(({image,position}) => image.naturalWidth !== position.width || image.naturalHeight !== position.height);
        if (frame.naturalWidth !== layout.width || frame.naturalHeight !== layout.height || mismatch || menuImages.some(image => image.naturalWidth !== 852 || image.naturalHeight !== 1846)) throw new Error('En bild har andra mått än layoutfilen');
        setView('interactive');
        stage.dataset.ready = 'true';
        positionStartup();
      } catch(error) {
        status.textContent = `Kunde inte visa alla bilddelar: ${error.message}`;
        document.querySelector('.app-notice').textContent = 'Instrumentpanelen kunde inte laddas. Ladda om sidan eller försök senare.';
      }
    }

      original = document.querySelector('#original');

      buildMenu();
      window.VFDashboard = {

            startupPendingData = data;

          if (data.connection !== 'checking') endStartup();
          screenContent.hidden = true;
          window.VFAppData = data;
          if ((restrictedViews[selectedMenu] && !data.user?.permissions?.includes(restrictedViews[selectedMenu])) ||
              (['medlemmar', 'information_manage'].includes(selectedMenu) &&
                !data.user?.permissions?.includes('board_view'))) {
            ++navigationRequest;
            selectedMenu = 'start';
            showMenuSelection();
          }
          previewName = String(data.fee?.name || '').trim().slice(0, 36);
          previewOnlineCount = Number.isSafeInteger(data.online) ? data.online : null;
          document.querySelector('#compact-online').textContent = previewOnlineCount === null
            ? '– online' : `${previewOnlineCount} online`;
          sampleMemberStatus = data.fee?.status === 'paid' ? 'paid' : data.fee?.status === 'unpaid' ? 'unpaid' : 'unknown';

          const meetingText = document.querySelector('.unconnected-meeting span');

          document.querySelector('.unconnected-meeting strong').textContent = isBoard ? 'Nästa möte' : 'Nästa medlemsmöte';
          meetingText.textContent = window.VFPreviewViews.meetingText(data.calendar, isBoard);
          document.querySelector('.unconnected-meeting').setAttribute('aria-hidden','false');
          const informationText = document.querySelector('.unconnected-board span');
          const latestInformation = data.information?.message?.text;
          informationText.textContent = latestInformation
            ? latestInformation.slice(0, 90) + (latestInformation.length > 90 ? '…' : '')
            : (data.information?.error ? 'Information kunde inte hämtas' : 'Inget meddelande publicerat');
          document.querySelector('.unconnected-board').setAttribute('aria-hidden','false');
          const compactFee = document.querySelector('.compact-fee');
          compactFee.textContent = sampleMemberStatus === 'paid' ? 'Medlemsavgift betald' : sampleMemberStatus === 'unpaid' ? 'Medlemsavgift inte betald' : 'Medlemsstatus saknas';
          compactFee.dataset.status = sampleMemberStatus;
        },
        setOnlineCount(count) {
          if (startupActive) return;
          if (!Number.isSafeInteger(count)) return;
          previewOnlineCount = count;
          document.querySelector('#compact-online').textContent = `${count} online`;
          const value = dashboardArt.querySelector('#online-value');

        },
        refresh() { renderMenuContent(); updateScreenContentVisibility(); },
      };
      document.dispatchEvent(new Event('vf:dashboard-ready'));
      for (const button of modeHits.querySelectorAll('button')) button.addEventListener('click', () => {
        selectedMode = button.dataset.mode;
        showModeSelection();
        status.textContent = `Del 02: ${selectedMode === 'neutral' ? 'Neutral' : 'Mötesläge'} valt. Endast utseendet växlar; mötesfunktionen byggs senare.`;
      });
      for (const button of cardHits.querySelectorAll('button')) {
        button.addEventListener('click', () => {
          selectMenu(button.dataset.card === 'meeting' ? 'kalender' : 'information');
        });
        button.addEventListener('pointerenter', () => { hoveredCard = button.dataset.card; showCardSelection(); });
        button.addEventListener('pointerleave', () => { hoveredCard = null; showCardSelection(); });
        button.addEventListener('focus', () => { hoveredCard = button.dataset.card; showCardSelection(); });
        button.addEventListener('blur', () => { hoveredCard = null; showCardSelection(); });
      }
      document.querySelector('[data-view="all"]').addEventListener('click', () => setView('all'));
      document.querySelector('[data-view="frame"]').addEventListener('click', () => setView('frame'));
      document.querySelector('[data-view="original"]').addEventListener('click', () => setView('original'));
      document.querySelector('[data-view="interactive"]').addEventListener('click', () => setView('interactive'));
      document.querySelector('[data-view="mode"]').addEventListener('click', () => setView('mode'));
      document.querySelector('[data-view="cards"]').addEventListener('click', () => setView('cards'));
      document.querySelector('[data-view="member"]').addEventListener('click', () => setView('member'));
      document.querySelector('[data-view="surfaces"]').addEventListener('click', () => setView('surfaces'));
      for (const button of surfaceHits.querySelectorAll('button')) {
        button.addEventListener('click', () => {
          selectedSurface = button.dataset.surface;
          showSurfaceSelection();
          status.textContent = `Skärmytor: ${button.getAttribute('aria-label')} vald. Formen är en separat modul.`;
        });
        button.addEventListener('pointerenter', () => { hoveredSurface = button.dataset.surface; showSurfaceSelection(); });
        button.addEventListener('pointerleave', () => { hoveredSurface = null; showSurfaceSelection(); });
        button.addEventListener('focus', () => { hoveredSurface = button.dataset.surface; showSurfaceSelection(); });
        button.addEventListener('blur', () => { hoveredSurface = null; showSurfaceSelection(); });
      }
      document.querySelector('#preview-name').addEventListener('input', event => { previewName = event.target.value.trim().slice(0,36); showDashboardDetails(); window.VFPreviewViews.refresh({name:previewName}); });
      document.querySelector('#preview-online').addEventListener('input', event => {
        const value = event.target.value;
        previewOnlineCount = value === '' ? null : Math.min(999,Math.max(0,Number(value)));
        showDashboardDetails();
        document.querySelector('#compact-online').textContent = previewOnlineCount === null ? '– online' : `${previewOnlineCount} online`;
      });
      document.querySelector('#load-forecast').addEventListener('click', loadLocalForecast);
      for (const button of document.querySelectorAll('[data-road-mode]')) button.addEventListener('click', () => {
        roadIndicatorMode = button.dataset.roadMode;
        updateRoadIndicator();
      });
      for (const button of document.querySelectorAll('[data-member-status]')) button.addEventListener('click', () => {
        sampleMemberStatus = button.dataset.memberStatus;
        showMemberPanel();
        status.textContent = `Del 13: klockan visar lokal tid. Medlemsstatus ${sampleMemberStatus === 'paid' ? 'grön' : 'röd'} är endast ett visuellt exempel.`;
      });
      showMemberPanel();
      showDashboardDetails();
      renderMenuContent();
      const updateCompactClock = () => { document.querySelector('#compact-time').textContent = new Intl.DateTimeFormat('sv-SE',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()); };
      updateCompactClock();
      setInterval(updateCompactClock, 10000);
      setInterval(showMemberPanel, 10000);
      setInterval(showSignalBars, 1600);
      setInterval(showLocalDate, 60 * 1000);
      setInterval(cycleRoadIndicator, 2200);
      setInterval(() => { if (!document.hidden && !forecastPermissionDenied) loadLocalForecast(); }, 30 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) { showMemberPanel(); showLocalDate(); } });
      window.addEventListener('resize', positionStartup);
      initialize();
      loadLocalForecast();
    });
  </script>
</head>
<body class="app-mode">
  <header>
    <h1>Vägfölk 26 – bilddelar</h1>
    <div class="actions" role="group" aria-label="Välj visning">
      <button type="button" data-view="all" aria-pressed="true">Alla delar</button>
      <button type="button" data-view="frame" aria-pressed="false">Endast ytterram</button>
      <button type="button" data-view="original" aria-pressed="false">Originalbild</button>
      <button type="button" data-view="interactive" aria-pressed="false">Prova del 04</button>
      <button type="button" data-view="mode" aria-pressed="false">Prova del 02</button>
      <button type="button" data-view="cards" aria-pressed="false">Prova del 06 och 09</button>
      <button type="button" data-view="member" aria-pressed="false">Prova del 13</button>
      <button type="button" data-view="surfaces" aria-pressed="false">Prova skärmytor</button>
    </div>
  </header>
  <div class="compact-shell" aria-label="Vägfölk 26 på mindre skärm">
    <div class="compact-rotate" hidden><strong>Vrid telefonen till liggande läge</strong>Alla funktioner finns kvar när skärmen är bredare.</div>
    <div class="compact-top"><span class="compact-brand">VÄGFÖLK <em>26</em></span><div class="compact-top-right"><span id="compact-online" class="compact-online">– online</span><time id="compact-time" class="compact-time"></time></div></div>
    <div class="compact-body"><nav class="compact-nav" id="compact-nav" aria-label="Huvudmeny"></nav><main class="compact-display" id="compact-content" aria-live="polite" data-start="true"></main><div class="compact-startup-host" id="compact-startup-host" hidden></div></div>
    <div class="compact-bottom"><span>Vägfölk 26</span><span class="compact-fee"></span></div>
  </div>
  <div class="stage" id="stage" role="group" aria-label="Vägfölk 26 instrumentpanel uppbyggd av separata bilddelar">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <filter id="icon-red" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".90 .55 .15 0 0  .10 .04 .02 0 0  .12 .03 .02 0 0  0 0 0 1 0"/></filter>
      <filter id="icon-blue" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".05 .05 .05 0 0  .20 .28 .10 0 0  .45 .55 .32 0 0  0 0 0 1 0"/></filter>
      <clipPath id="central-screen-clip" clipPathUnits="objectBoundingBox"><path d="M .053 0 H .942 Q .974 0 .987 .032 L 1 .071 V .928 Q 1 .965 .967 1 H .032 Q 0 1 0 .956 V .077 Q 0 .036 .053 0 Z"/></clipPath>
    </defs></svg>
    <img class="original" id="original" alt="" hidden>
    <div class="menu-start-neutral" id="menu-start-neutral" hidden aria-hidden="true"><img alt=""></div>
    <svg class="menu-label-art" id="menu-label-art" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="task-label-cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1015"/><stop offset=".55" stop-color="#080d12"/><stop offset="1" stop-color="#10151a"/></linearGradient></defs>
      <path d="M 90 388 H 225 V 428 H 90 Z" fill="url(#task-label-cover)"/>
      <text x="106" y="416" fill="#edf2f3" font-family="Segoe UI,Arial,sans-serif" font-size="20">Att göra</text>
      <path d="M 84 463 H 223 V 502 H 84 Z" fill="url(#task-label-cover)"/>
      <text x="105" y="490" fill="#edf2f3" font-family="Segoe UI,Arial,sans-serif" font-size="21">Chat</text>
    </svg>
    <svg class="menu-active-art" id="menu-active-art" viewBox="0 0 1672 941" preserveAspectRatio="none" hidden aria-hidden="true"></svg>
    <nav class="menu-hits" id="menu-hits" aria-label="Vänster huvudmeny" hidden></nav>
    <svg class="mode-art" id="mode-art" viewBox="0 0 1672 941" preserveAspectRatio="none" hidden aria-hidden="true"></svg>
    <div class="mode-hits" id="mode-hits" role="group" aria-label="Välj visningsläge" hidden><button type="button" data-mode="neutral" aria-label="Neutral"></button><button type="button" data-mode="meeting" aria-label="Mötesläge"></button></div>
    <svg class="card-art" id="card-art" viewBox="0 0 1672 941" preserveAspectRatio="none" hidden aria-hidden="true"></svg>
    <div class="card-hits" id="card-hits" role="group" aria-label="Informationskort" hidden><button type="button" data-card="meeting" aria-label="Nästa medlemsmöte"></button><button type="button" data-card="board" aria-label="Information"></button></div>
    <svg class="member-art" id="member-art" viewBox="0 0 1672 941" preserveAspectRatio="none" hidden aria-hidden="true"></svg>
    <svg class="dashboard-art" id="dashboard-art" viewBox="0 0 1672 941" preserveAspectRatio="none" hidden aria-hidden="true"></svg>
    <div class="unconnected-card unconnected-meeting" aria-hidden="true"><strong>Nästa medlemsmöte</strong><span></span></div>
    <div class="unconnected-card unconnected-board" aria-hidden="true"><strong>Information</strong><span></span></div>
    <svg class="surface-art" id="surface-art" viewBox="0 0 1672 941" preserveAspectRatio="none" hidden aria-hidden="true"></svg>
    <div class="surface-hits" id="surface-hits" role="group" aria-label="Välj skärmyta" hidden><button type="button" data-surface="main" aria-label="Huvudskärmen"></button><button type="button" data-surface="left" aria-label="Vänster tomma panel"></button><button type="button" data-surface="right" aria-label="Höger tomma panel"></button></div>
    <div class="screen-viewport" id="screen-viewport" hidden>
      <section class="screen-content" id="screen-content" aria-live="polite" hidden></section>
      <div class="screen-startup" id="screen-startup" role="status" aria-label="Ansluter till EKO" hidden><video id="screen-startup-video" muted playsinline preload="auto" aria-hidden="true"></video></div>
    </div>
  </div>
  <div class="preview-inputs" aria-label="Förhandsvisa personliga uppgifter">
    <label for="preview-name">Förhandsvisa namn</label><input id="preview-name" type="text" autocomplete="off" maxlength="36" placeholder="Namn från inloggning">
    <label for="preview-online">Antal online</label><input id="preview-online" type="number" min="0" max="999" step="1" placeholder="–">
    <button type="button" id="load-forecast">Hämta prognos igen</button><span id="forecast-feedback" role="status">Försöker hämta prognos för din plats.</span>
  </div>
  <div class="status-options" data-visible="true" role="group" aria-label="Förhandsvisa vägsymbol"><span>Vägsymbol:</span><button type="button" data-road-mode="alternate" aria-pressed="true">Växla grön/blå</button><button type="button" data-road-mode="neutral" aria-pressed="false">Neutral</button><button type="button" data-road-mode="green" aria-pressed="false">Grön</button><button type="button" data-road-mode="blue" aria-pressed="false">Blå</button></div>

  <p class="status" id="status" role="status">Läser bilddelarna…</p>
  <p class="app-notice" role="status"></p>
  <div class="panel-list" id="panel-list" aria-label="Visa en panel i taget"></div>

</html>
